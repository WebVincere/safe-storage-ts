name: Weekly Dependency Health Report

on:
    schedule:
        # Every Friday at 9 PM IST (3:30 PM UTC)
        - cron: "30 15 * * 5"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: weekly-dependency-health
    cancel-in-progress: false

jobs:
    dependency-health:
        name: Dependency Health Report
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout main
              uses: actions/checkout@v5
              with:
                  ref: main
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check outdated dependencies
              shell: bash
              run: npm outdated --json > outdated.json || true

            - name: Check security vulnerabilities
              shell: bash
              run: npm audit --json > audit.json || true

            - name: Generate dependency health report
              shell: bash
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_SHA: ${{ github.sha }}
              run: |
                  node <<'NODE'
                  const fs = require('fs');

                  function readJson(file) {
                    const content = fs.readFileSync(file, 'utf8').trim();
                    return content ? JSON.parse(content) : {};
                  }

                  const outdated = readJson('outdated.json');
                  const audit = readJson('audit.json');
                  const pkg = require('./package.json');

                  const prod = pkg.dependencies || {};
                  const dev = pkg.devDependencies || {};
                  const optional = pkg.optionalDependencies || {};
                  const peer = pkg.peerDependencies || {};

                  const escapeHtml = value =>
                    String(value ?? '-').replace(/[&<>"']/g, c => ({
                      '&': '&amp;',
                      '<': '&lt;',
                      '>': '&gt;',
                      '"': '&quot;',
                      "'": '&#39;'
                    })[c]);

                  function parseVersion(version) {
                    const match = String(version || '').match(
                      /^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/
                    );

                    if (!match) return null;

                    return {
                      major: Number(match[1]),
                      minor: Number(match[2]),
                      patch: Number(match[3])
                    };
                  }

                  function classify(from, to) {
                    const a = parseVersion(from);
                    const b = parseVersion(to);

                    if (!a || !b) return 'Other';
                    if (a.major !== b.major) return 'Major';
                    if (a.minor !== b.minor) return 'Minor';
                    if (a.patch !== b.patch) return 'Patch';

                    return 'Other';
                  }

                  function getScope(name) {
                    if (prod[name]) return 'PROD';
                    if (dev[name]) return 'DEV';
                    if (optional[name]) return 'OPTIONAL';
                    if (peer[name]) return 'PEER';
                    return 'OTHER';
                  }

                  const sections = {
                    remediation: {
                      Major: [],
                      Minor: [],
                      Patch: [],
                      Other: []
                    },
                    upstream: {
                      Major: [],
                      Minor: [],
                      Patch: [],
                      Other: []
                    }
                  };

                  for (const [name, info] of Object.entries(outdated)) {
                    const current = String(info.current || '-');
                    const wanted = String(info.wanted || '-');
                    const latest = String(info.latest || '-');

                    const item = {
                      name,
                      current,
                      wanted,
                      latest,
                      scope: getScope(name)
                    };

                    if (current !== wanted) {
                      sections.remediation[
                        classify(current, wanted)
                      ].push(item);
                    }

                    if (wanted !== latest) {
                      sections.upstream[
                        classify(wanted, latest)
                      ].push(item);
                    }
                  }

                  const vulnerabilities =
                    audit.metadata?.vulnerabilities || {};

                  const severity = key => vulnerabilities[key] || 0;

                  const totalVulnerabilities = [
                    'critical',
                    'high',
                    'moderate',
                    'low',
                    'info'
                  ].reduce((sum, key) => sum + severity(key), 0);

                  const auditFailed = Boolean(audit.error);

                  const totalOutdated = Object.keys(outdated).length;

                  const totalRemediation = Object.values(
                    sections.remediation
                  ).reduce((sum, items) => sum + items.length, 0);

                  const totalUpstream = Object.values(
                    sections.upstream
                  ).reduce((sum, items) => sum + items.length, 0);

                  const totalDependencies =
                    Object.keys(prod).length +
                    Object.keys(dev).length +
                    Object.keys(optional).length +
                    Object.keys(peer).length;

                  const report = [];

                  function addMessage(lines) {
                    report.push(...lines);
                    report.push('');
                  }

                  function makeTable(items) {
                    const lines = [
                      '<pre>',
                      'PACKAGE        CURRENT  WANTED   LATEST   SCOPE',
                      '------------------------------------------------'
                    ];

                    for (const item of items) {
                      const row = [
                        item.name.slice(0, 14).padEnd(15),
                        item.current.slice(0, 7).padEnd(8),
                        item.wanted.slice(0, 7).padEnd(9),
                        item.latest.slice(0, 7).padEnd(8),
                        item.scope
                      ].join('');

                      lines.push(escapeHtml(row));
                    }

                    lines.push('</pre>');
                    return lines;
                  }

                  function addVersionSection(title, data, emoji) {
                    const hasItems = Object.values(data)
                      .some(items => items.length > 0);

                    if (!hasItems) {
                      addMessage([
                        `<b>${title}</b>`,
                        '✅ No issues detected.'
                      ]);
                      return;
                    }

                    for (const [type, items] of Object.entries(data)) {
                      if (!items.length) continue;

                      addMessage([
                        `<b>${title}</b>`,
                        '',
                        `${emoji[type]} <b>${type} (${items.length})</b>`,
                        ...makeTable(items)
                      ]);
                    }
                  }

                  addMessage([
                    '<b>━━━━━━━━━━━━━━━━━━━━</b>',
                    '<b>📊 DEVOPS DIGEST</b>',
                    '<b>WEEKLY DEPENDENCY HEALTH</b>',
                    '<b>━━━━━━━━━━━━━━━━━━━━</b>',
                    '',
                    `📦 <b>PROJECT: ${escapeHtml(pkg.name)}</b>`,
                    `Production dependencies: ${Object.keys(prod).length}`,
                    `Development dependencies: ${Object.keys(dev).length}`,
                    `Optional dependencies: ${Object.keys(optional).length}`,
                    `Peer dependencies: ${Object.keys(peer).length}`,
                    `Total declared dependencies: ${totalDependencies}`,
                    `Outdated packages: ${totalOutdated}`
                  ]);

                  addVersionSection(
                    '🚨 CURRENT / WANTED MISMATCH',
                    sections.remediation,
                    {
                      Major: '🔴',
                      Minor: '🟠',
                      Patch: '🟡',
                      Other: '⚪'
                    }
                  );

                  if (totalRemediation > 0) {
                    addMessage([
                      '<b>🚨 REMEDIATION REQUIRED</b>',
                      '',
                      `${totalRemediation} package(s) have an installed version different from the wanted version.`,
                      '',
                      '1. Review affected dependencies.',
                      '2. Update intended packages.',
                      '3. Review package-lock.json.',
                      '4. Run the test suite.',
                      '5. Commit the updated lockfile.'
                    ]);
                  }

                  addVersionSection(
                    '🌐 NEW UPSTREAM RELEASES',
                    sections.upstream,
                    {
                      Major: '🔴',
                      Minor: '🟠',
                      Patch: '🟢',
                      Other: '⚪'
                    }
                  );

                  if (totalUpstream > 0) {
                    addMessage([
                      '<b>💡 UPSTREAM RECOMMENDATION</b>',
                      '',
                      `${totalUpstream} package(s) have newer upstream releases.`,
                      '',
                      'Review changelogs and breaking changes.',
                      'Update package.json when appropriate.',
                      'Do not blindly upgrade major versions.'
                    ]);
                  }

                  const auditLines = [
                    '<b>━━━━━━━━━━━━━━━━━━━━</b>',
                    '<b>🛡️ SECURITY AUDIT</b>',
                    '',
                    `🔴 Critical: ${severity('critical')}`,
                    `🟠 High: ${severity('high')}`,
                    `🟡 Moderate: ${severity('moderate')}`,
                    `🔵 Low: ${severity('low')}`,
                    `⚪ Info: ${severity('info')}`,
                    '',
                    `Total vulnerabilities: ${totalVulnerabilities}`
                  ];

                  if (auditFailed) {
                    auditLines.push('');
                    auditLines.push('⚠️ <b>SECURITY AUDIT FAILED</b>');
                    auditLines.push(
                      escapeHtml(
                        audit.error.summary ||
                        audit.error.code ||
                        'Check npm audit output.'
                      )
                    );
                    auditLines.push(
                      'Security status is unknown until the audit succeeds.'
                    );
                  } else if (totalVulnerabilities > 0) {
                    auditLines.push('');
                    auditLines.push('⚠️ Vulnerabilities detected.');
                    auditLines.push('Run npm audit for advisory details.');
                  } else {
                    auditLines.push('');
                    auditLines.push('✅ No reported vulnerabilities.');
                  }

                  addMessage(auditLines);

                  let status;

                  if (auditFailed) {
                    status = '⚪ SECURITY AUDIT INCOMPLETE';
                  } else if (
                    severity('critical') || severity('high')
                  ) {
                    status = '🔴 CRITICAL SECURITY ACTION REQUIRED';
                  } else if (
                    totalRemediation || severity('moderate')
                  ) {
                    status = '🟠 REMEDIATION REQUIRED';
                  } else if (
                    totalUpstream || totalVulnerabilities
                  ) {
                    status = '🟡 REVIEW RECOMMENDED';
                  } else {
                    status = '🟢 HEALTHY';
                  }

                  const recommendations = [];

                  if (auditFailed) {
                    recommendations.push(
                      '1. Resolve npm audit error and rerun the scan.'
                    );
                  }

                  if (severity('critical') || severity('high')) {
                    recommendations.push(
                      '2. Investigate Critical/High vulnerabilities immediately.'
                    );
                  }

                  if (totalRemediation) {
                    recommendations.push(
                      '3. Review current/wanted mismatches and update lockfile.'
                    );
                  }

                  if (totalUpstream) {
                    recommendations.push(
                      '4. Review upstream releases and compatibility.'
                    );
                  }

                  if (!recommendations.length) {
                    recommendations.push(
                      '✅ No immediate dependency remediation required.'
                    );
                  }

                  const repository = process.env.GITHUB_REPOSITORY;
                  const runId = process.env.GITHUB_RUN_ID;
                  const sha = process.env.GITHUB_SHA || 'local';

                  const summary = [
                    '<b>━━━━━━━━━━━━━━━━━━━━</b>',
                    '<b>📈 FINAL HEALTH SUMMARY</b>',
                    '',
                    `Lockfile mismatches: ${totalRemediation}`,
                    `New upstream releases: ${totalUpstream}`,
                    `Security vulnerabilities: ${totalVulnerabilities}`,
                    `Security audit failed: ${auditFailed ? 'YES' : 'NO'}`,
                    '',
                    `<b>STATUS: ${status}</b>`,
                    '',
                    '<b>💡 RECOMMENDED ACTIONS</b>',
                    ...recommendations,
                    ''
                  ];

                  if (repository && runId) {
                    summary.push(
                      `🔗 <a href="https://github.com/${escapeHtml(repository)}/actions/runs/${escapeHtml(runId)}">View GitHub Actions Run</a>`
                    );
                  }

                  summary.push(
                    `Commit: <code>${escapeHtml(sha.slice(0, 7))}</code>`
                  );

                  summary.push('');
                  summary.push('<i>Automated weekly dependency report.</i>');

                  addMessage(summary);

                  const finalReport = report.join('\n').trim();

                  fs.writeFileSync(
                    'telegram-report.txt',
                    finalReport
                  );

                  console.log('Dependency health report generated.');

                  console.log({
                    totalDependencies,
                    totalOutdated,
                    totalRemediation,
                    totalUpstream,
                    totalVulnerabilities,
                    auditFailed,
                    status
                  });
                  NODE

            - name: Send Telegram report
              shell: bash
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
              run: |
                  node <<'NODE'
                  const fs = require('fs');

                  async function main() {
                    const token = process.env.TELEGRAM_BOT_TOKEN;
                    const chatId = process.env.TELEGRAM_CHAT_ID;

                    if (!token || !chatId) {
                      throw new Error(
                        'Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID.'
                      );
                    }

                    const report = fs.readFileSync(
                      'telegram-report.txt',
                      'utf8'
                    );

                    const url =
                      `https://api.telegram.org/bot${token}/`;

                    const reportLength = Array.from(report).length;

                    let response;

                    if (reportLength <= 3900) {
                      response = await fetch(
                        url + 'sendMessage',
                        {
                          method: 'POST',
                          headers: {
                            'Content-Type': 'application/json'
                          },
                          body: JSON.stringify({
                            chat_id: chatId,
                            text: report,
                            parse_mode: 'HTML',
                            disable_web_page_preview: true
                          })
                        }
                      );
                    } else {
                      const form = new FormData();

                      form.append('chat_id', chatId);

                      form.append(
                        'document',
                        new Blob(
                          [report],
                          { type: 'text/html' }
                        ),
                        'weekly-dependency-health-report.html'
                      );

                      response = await fetch(
                        url + 'sendDocument',
                        {
                          method: 'POST',
                          body: form
                        }
                      );
                    }

                    const result = await response.json();

                    if (!response.ok || !result.ok) {
                      throw new Error(
                        'Telegram delivery failed: ' +
                        JSON.stringify(result)
                      );
                    }

                    console.log(
                      reportLength <= 3900
                        ? 'Complete report sent as one Telegram message.'
                        : 'Complete report sent as one document.'
                    );
                  }

                  main().catch(error => {
                    console.error(error);
                    process.exit(1);
                  });
                  NODE
